<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pionex Grid — SQLite 儀表板</title>
  <style>
    :root {
      --ink:#172026; --ink-2:#3d4d54; --muted:#66787f;
      --line:#e2e9ec; --line-strong:#cfdade;
      --surface:#fff; --soft:#f2f6f7; --bg:#f5f8f9;
      --head:#1f2c31; --head-line:#2c3a40; --head-dim:#9fb4ba;
      --accent:#2e6970; --accent-soft:#e6f0f1;
      --up:#1f7a4d; --down:#b42318; --warn:#8b5e22;
      --r-sm:6px; --r:10px; --r-pill:999px;
      --shadow:0 1px 2px #1720260a, 0 8px 20px #17202610;
      /* 圖表系列色（依建倉順序固定分配），合計線用 --accent */
      --s1:#3b78c3; --s2:#d9772f; --s3:#4b9a58; --s4:#c2464f; --s5:#8662b5;
      --s6:#b08a1e; --s7:#cf6aa1; --s8:#5f7387; --s9:#97633f; --s10:#2a9d8f;
      --s11:#7b9a2a; --s12:#e3a21f; --s13:#4352b0; --s14:#e7716b; --s15:#4fa1c7;
      --s16:#9c4f92; --s17:#16a6b6; --s18:#a5a51c; --s19:#7d7d7d; --s20:#5e3c99;
      --heat-pos:46,105,112; --heat-neg:180,35,24;
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
           font:14px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif; }
    :focus-visible { outline:2px solid #6fa7ae; outline-offset:2px; }

    .btn { display:inline-block; background:var(--accent); color:#fff; border:1px solid var(--accent);
           padding:8px 14px; border-radius:var(--r-sm); cursor:pointer; text-decoration:none;
           font:inherit; font-size:13.5px; line-height:1.2; }
    .btn:hover { background:#25585e; border-color:#25585e; }
    .btn.ghost { background:var(--surface); color:var(--accent); border-color:var(--line-strong); }
    .btn.ghost:hover { background:var(--accent-soft); border-color:var(--accent); }
    .btn.danger { background:#8b4a3a; border-color:#8b4a3a; }
    .btn.danger:hover { background:#773f31; border-color:#773f31; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn.tiny { padding:4px 9px; font-size:12px; }

    header { background:var(--head); color:#fff; padding:18px 24px 0; }
    header h1 { margin:0 0 3px; font-size:19px; font-weight:650; letter-spacing:.01em; }
    header .sub { margin:0 0 12px; color:var(--head-dim); font-size:12.5px; }
    nav { display:flex; gap:4px; flex-wrap:wrap; align-items:center;
          border-top:1px solid var(--head-line); padding:8px 0; }
    nav button, nav .btn { font:inherit; font-size:13.5px; line-height:1;
          padding:8px 14px; border-radius:var(--r-pill); border:1px solid transparent; cursor:pointer; }
    nav button { background:transparent; color:#c3d5da; }
    nav button:hover { background:#2b3a40; color:#fff; }
    nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    nav .btn { background:transparent; color:#cfe0e4; border-color:#41545b; text-decoration:none; }
    nav .btn:hover { background:#2b3a40; color:#fff; border-color:#5b7178; }
    nav a.btn:first-of-type { margin-left:auto; }

    main { max-width:1280px; margin:0 auto; padding:20px 16px 64px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
            box-shadow:var(--shadow); padding:16px 18px; margin:14px 0; overflow:auto; }
    .card.narrow { max-width:600px; }
    .card > h3:first-child { margin-top:0; }
    .card h3 { margin:0 0 12px; font-size:15px; font-weight:650; }
    .muted, .note { color:var(--muted); font-size:12.5px; line-height:1.65; max-width:80ch; }
    .warn { color:var(--warn); }
    .up { color:var(--up); }
    .down { color:var(--down); }

    .hint { cursor:help; border-bottom:1px dotted #94aeb5; }
    .hint:hover, .hint:focus-visible { border-bottom-color:var(--accent); color:var(--accent); }
    .hint-pop { position:absolute; z-index:30; max-width:300px; background:var(--head); color:#fff;
            font-size:12.5px; line-height:1.6; padding:11px 13px; border-radius:var(--r-sm);
            box-shadow:0 10px 26px #17202640; }

    .stats { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:12px; }
    .stat { grid-column:span 3; display:flex; flex-direction:column; gap:6px; min-height:98px;
            background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
            box-shadow:var(--shadow); padding:14px 16px; }
    .stat.wide { grid-column:span 4; }
    .stat .label, .stat .hint { font-size:12px; font-weight:500; color:var(--muted);
            letter-spacing:.02em; line-height:1.35; align-self:flex-start; text-align:left; }
    .stat strong { font-size:25px; font-weight:650; line-height:1.15; white-space:nowrap;
            font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
    .stat .unit { font-size:13px; font-weight:600; color:var(--muted); margin-left:5px; }
    .stat .twd { display:block; font-size:12px; font-weight:500; color:var(--muted);
            font-variant-numeric:tabular-nums; }
    .stat .pct { display:block; font-size:13px; font-weight:600; margin-top:2px; }
    .stat.meta strong { font-size:17px; white-space:normal; line-height:1.4; }

    table.board { width:100%; min-width:1160px; border-collapse:separate; border-spacing:0;
            table-layout:fixed; font-size:13px; }
    table.board th, table.board td { border-bottom:1px solid var(--line); padding:11px 14px; }
    table.board th { background:var(--soft); position:sticky; top:0; z-index:1;
            vertical-align:bottom; font-weight:600; border-bottom-color:var(--line-strong); }
    table.board td { vertical-align:top; }
    table.board .v { display:block; line-height:20px; white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
    table.board .sub { display:block; min-height:16px; line-height:16px; font-size:11.5px;
            font-weight:500; color:var(--muted); white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
    table.board .n { text-align:right; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
    table.board .t { text-align:left; }
    table.board td.c-sym .v { font-weight:650; }
    table.board .hd-top { display:flex; align-items:center; gap:4px; line-height:18px;
            white-space:nowrap; overflow:hidden; }
    table.board th.n .hd-top { justify-content:flex-end; }
    table.board .hd-unit { display:block; min-height:15px; line-height:15px; font-size:11px;
            font-weight:500; color:var(--muted); white-space:nowrap; overflow:hidden; }
    table.board th.n .hd-unit { text-align:right; }
    table.board th .arrow { flex:none; width:10px; font-size:9px; font-style:normal; color:var(--accent); }
    table.board th.n .arrow { order:-1; }
    table.board th .hint { border-bottom:1px dotted #94aeb5; }
    table.board th.sortable { cursor:pointer; user-select:none; }
    table.board th.sortable:hover { color:var(--accent); }
    table.board th.sort-asc .arrow::after { content:"\25B2"; }
    table.board th.sort-desc .arrow::after { content:"\25BC"; }
    table.board col.c-date { width:9.5%; }
    table.board col.c-size { width:11.7%; }
    table.board col.c-sym  { width:14.3%; }
    table.board col.c-mark { width:10.4%; }
    table.board col.c-liq  { width:11.3%; }
    table.board col.c-dist { width:9.5%; }
    table.board col.c-grid { width:12.4%; }
    table.board col.c-day  { width:11.2%; }
    table.board col.c-pct  { width:9.7%; }
    table.board th.c-sym, table.board td.c-sym { padding-left:56px; }
    tr.clickable { cursor:pointer; }
    tr.clickable:hover > td { background:var(--accent-soft); }
    tr.clickable:hover > td:first-child { box-shadow:inset 2px 0 0 var(--accent); }

    table.plain { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:13px; }
    table.plain th, table.plain td { border-bottom:1px solid var(--line); padding:9px 12px;
            text-align:right; font-variant-numeric:tabular-nums; }
    table.plain th { background:var(--soft); font-size:11.5px; font-weight:600; color:var(--muted);
            border-bottom-color:var(--line-strong); }
    table.plain th:first-child, table.plain td:first-child,
    table.plain th:nth-child(2), table.plain td:nth-child(2) { text-align:left; }
    table.kv { width:100%; border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:13px; }
    table.kv th, table.kv td { border-bottom:1px solid var(--line); padding:8px 12px;
            vertical-align:top; word-break:break-word; }
    table.kv th { width:32%; text-align:left; font-size:12px; font-weight:600;
            color:var(--muted); background:var(--soft); }
    table.kv td { text-align:left; font-variant-numeric:tabular-nums; }
    details { margin:10px 0; }
    details > summary { cursor:pointer; font-weight:600; font-size:13.5px; padding:8px 0; }
    select { padding:7px 10px; font:inherit; font-size:13.5px; color:var(--ink);
            background:var(--surface); border:1px solid var(--line-strong);
            border-radius:var(--r-sm); max-width:100%; }
    label { font-size:13.5px; }

    .live-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; }
    .live-bar .note { flex:1 1 320px; margin:0; }
    .history-back { position:sticky; top:0; z-index:5; background:var(--bg);
            padding:4px 0 10px; margin:0 0 8px; }
    .mask { position:fixed; inset:0; background:#17202666; z-index:40; display:flex;
            align-items:center; justify-content:center; padding:16px; }
    .mask[hidden] { display:none !important; }
    .dialog { background:var(--surface); border-radius:var(--r); max-width:440px; padding:20px 22px;
            box-shadow:0 16px 40px #17202640; }
    .dialog h3 { margin:0 0 8px; font-size:16px; }
    .dialog p { margin:8px 0; font-size:13.5px; line-height:1.6; }
    .dialog .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

    .day { background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
           box-shadow:var(--shadow); margin:12px 0; overflow:hidden; }
    .day h3 { margin:0; padding:13px 16px; font-size:15px; font-weight:650; cursor:pointer;
           display:flex; justify-content:space-between; align-items:baseline; gap:12px;
           flex-wrap:wrap; background:var(--soft); border-bottom:1px solid var(--line); }
    .day h3 .meta { font-size:12.5px; font-weight:500; color:var(--muted);
           font-variant-numeric:tabular-nums; }
    .day h3 .meta b { font-weight:650; }
    .day .body { padding:0 6px 6px; overflow:auto; }

    .cal-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
    .cal-head strong { font-size:16px; font-weight:650; }
    .cal-head button { width:32px; height:32px; border-radius:50%; background:var(--surface);
           color:var(--accent); border:1px solid var(--line-strong); cursor:pointer;
           font:inherit; font-size:16px; line-height:1; }
    .cal-head button:hover { background:var(--accent-soft); border-color:var(--accent); }
    .cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; }
    .cal-dow { text-align:center; color:var(--muted); font-size:11.5px; padding:2px 0 4px; }
    .cal-cell { min-height:76px; display:flex; flex-direction:column; gap:3px; text-align:left;
           background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
           padding:7px 8px; }
    button.cal-cell { cursor:pointer; width:100%; font:inherit; color:inherit; background:var(--cell-bg, var(--surface)); }
    button.cal-cell:hover { border-color:var(--accent); background:var(--accent-soft); }
    .cal-cell.is-selected { border-color:var(--accent); background:var(--accent-soft);
           box-shadow:inset 0 0 0 1px var(--accent); }
    .cal-cell.is-empty { background:#fafcfc; }
    .cal-cell.is-empty .cal-num { color:var(--muted); font-weight:500; }
    .cal-cell.is-pad { background:transparent; border-color:transparent; min-height:0; }
    .cal-num { font-weight:650; font-size:12.5px; }
    .cal-amt { display:flex; justify-content:space-between; gap:6px; font-size:11px;
           color:var(--muted); font-variant-numeric:tabular-nums; }
    .cal-amt b { font-weight:600; color:var(--ink-2); }
    .cal-amt b.up { color:var(--up); }
    .cal-amt b.down { color:var(--down); }
    .fund-cal .cal-cell { min-height:118px; gap:2px; }
    .fund-cal .cal-amt { font-size:10.5px; }
    .fund-cal .cal-amt b { white-space:nowrap; }
    .fund-cal .cal-amt b.net { font-size:12px; font-weight:700; }
    table.plain.lever-cmp th small { display:block; font-weight:400; font-size:11px; }
    table.plain.lever-cmp th:nth-child(2), table.plain.lever-cmp td:nth-child(2) { text-align:right; }
    table.plain.lever-cmp th:first-child { width:15%; }
    table.plain.lever-cmp tr.total td { background:var(--soft); border-top:1px solid var(--line-strong); }
    table.plain.lever-defs th, table.plain.lever-defs td { text-align:left; vertical-align:top; line-height:1.55; }
    table.plain.lever-defs th:first-child { width:15%; }
    table.plain.lever-defs th:nth-child(2), table.plain.lever-defs th:nth-child(3) { width:26%; }
    .legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin:14px 0 0; padding-top:12px;
           border-top:1px solid var(--line); font-size:12px; line-height:1.6; color:var(--muted); }
    .legend b { color:var(--ink-2); font-weight:650; }

    .event-tag { display:inline-block; font-size:11px; line-height:16px; padding:0 7px; font-weight:600;
           border-radius:var(--r-pill); background:#e4ebed; color:var(--ink-2); margin-right:4px; }
    .event-tag.is-review { background:#f6e8ca; color:var(--warn); }
    .event-tag.is-add { background:var(--accent-soft); color:var(--accent); }
    .decide { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }

    .statlist { margin:0; display:grid; grid-template-columns:max-content 1fr; gap:11px 24px;
           align-items:baseline; font-size:14px; }
    .statlist dt { color:var(--muted); font-size:12.5px; }
    .statlist dd { margin:0; font-variant-numeric:tabular-nums; }
    .statlist .hintline { display:block; font-size:12px; color:var(--muted); margin-top:3px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px;
           background:var(--up); vertical-align:1px; }
    .dot.is-warn { background:var(--warn); }

    main a { color:var(--accent); text-underline-offset:2px; }
    main a:hover { color:#25585e; }
    .flash-wrap { max-width:1280px; margin:0 auto; padding:14px 16px 0; }
    .flash-wrap:empty { display:none; }
    .notice { display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
           background:var(--accent-soft); color:var(--ink-2); border:1px solid #c6dcdf;
           border-radius:var(--r-sm); padding:9px 12px; font-size:13px; line-height:1.55; }
    .notice.is-error { background:#fbeceb; border-color:#efc5c1; color:var(--down); }
    .notice button { flex:none; background:none; border:0; color:inherit; cursor:pointer;
           font:inherit; font-size:16px; line-height:1; padding:0 2px; }
    .badge { display:inline-block; font-size:11px; line-height:17px; padding:0 7px; font-weight:600;
           border-radius:var(--r-pill); background:#e4ebed; color:var(--ink-2); white-space:nowrap; }
    .badge.ok { background:#e3f1e9; color:var(--up); }
    .badge.warn { background:#f6e8ca; color:var(--warn); }
    .field { display:block; font-size:13px; margin:0 0 12px; }
    .field input, .field textarea { display:block; width:100%; margin-top:5px; padding:8px 10px;
           font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
           border:1px solid var(--line-strong); border-radius:var(--r-sm); }
    .field .help { display:block; margin-top:3px; font-size:11.5px; color:var(--muted); }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:0 20px; }
    .formula { background:var(--soft); border:1px solid var(--line); border-radius:var(--r-sm);
           padding:10px 12px; margin:10px 0 14px; font-size:13px; line-height:1.7;
           font-variant-numeric:tabular-nums; }
    .formula b { font-weight:650; }
    table.plain td small, table.plain td .sub2 { display:block; font-size:11.5px; color:var(--muted); line-height:1.5; }
    table.plain.wide th, table.plain.wide td { vertical-align:top; }
    .cal-sum { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:center; }
    .cal-sum b { font-weight:650; }
    .audit-list { margin:6px 0 0; padding:0; list-style:none; font-size:12.5px; }
    .audit-list li { padding:6px 0; border-bottom:1px solid var(--line); }
    tr.clickable:focus-visible > td { background:var(--accent-soft); }

    /* 圖表（chart.js） */
    .chart { position:relative; min-height:60px; }
    .chart-wrap { position:relative; }
    .chart-svg { display:block; max-width:100%; font:11px/1 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
           font-variant-numeric:tabular-nums; user-select:none; }
    .chart-svg .grid { stroke:var(--line); stroke-width:1; }
    .chart-svg .grid.zero { stroke:#b9c8cd; }
    .chart-svg .tick { stroke:var(--line-strong); }
    .chart-svg .ylab, .chart-svg .xlab { fill:var(--muted); }
    .chart-svg .hlab { fill:var(--ink-2); font-size:12px; font-weight:600; }
    .chart-svg .hsub { fill:var(--muted); font-size:10.5px; }
    .chart-svg .series .ln { fill:none; stroke:var(--c); stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }
    .chart-svg .series.strong .ln { stroke-width:2.8; }
    .chart-svg .series.dashed .ln { stroke-dasharray:6 3; }
    .chart-svg .series .ln.est { stroke-dasharray:3 3; opacity:.75; }
    .chart-svg .series.faded { opacity:.13; }
    .chart-svg .series.overlay .ln { stroke-width:2; }
    .chart-svg .dot { fill:var(--c); }
    .chart-svg .dot.hollow { fill:#fff; stroke:var(--c); stroke-width:1.4; }
    .chart-svg .bar.est { opacity:.42; }
    .chart-svg .bar.faded { opacity:.15; }
    .chart-svg .sel-band { fill:var(--accent-soft); }
    .chart-svg .cross { stroke:#94aeb5; stroke-dasharray:3 3; }
    .chart-svg .brush { fill:#2e697022; stroke:var(--accent); stroke-dasharray:3 2; }
    .chart-svg .hit { fill:transparent; touch-action:pan-y; }
    .chart-svg .hit.brushable { cursor:crosshair; }
    .chart-svg .hit.clickable { cursor:pointer; }
    .chart-svg .marker { cursor:help; stroke:#fff; stroke-width:1; }
    .chart-svg .mk { stroke:var(--ink); fill:var(--ink); stroke-width:1.4; }
    .chart-svg .row-hit { fill:transparent; }
    .chart-svg .row-hit:hover, .chart-svg .row-hit:focus { fill:#2e697010; outline:none; }
    .chart-empty { color:var(--muted); font-size:13px; padding:28px 0; text-align:center; }
    .chart-tip { position:absolute; z-index:20; pointer-events:none; min-width:180px; max-width:340px;
           background:var(--head); color:#fff; border-radius:var(--r-sm); padding:9px 11px;
           font-size:12px; line-height:1.5; box-shadow:0 10px 26px #17202640; }
    .chart-tip[hidden] { display:none; }
    .ct-title { font-weight:650; margin-bottom:4px; color:#e3eef1; }
    .ct-row { display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .ct-l { flex:1; overflow:hidden; text-overflow:ellipsis; color:#c9d9dd; }
    .ct-v { font-weight:650; font-variant-numeric:tabular-nums; }
    .ct-v.up { color:#8fd3ae; } .ct-v.down { color:#f2a59d; }
    .ct-foot { margin-top:5px; color:var(--head-dim); font-size:11px; }
    .sw { display:inline-block; flex:none; width:9px; height:9px; border-radius:2px; vertical-align:0; margin-right:2px; }
    .spark { display:block; margin-left:auto; }
    .spark-zero { stroke:var(--line-strong); stroke-dasharray:2 2; }
    .spark-none { color:var(--muted); }
    .chart-legend { display:flex; flex-wrap:wrap; gap:4px 6px; margin:10px 0 0; }
    .chart-legend button { display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:12px; line-height:1.3;
           padding:4px 9px; border:1px solid var(--line); border-radius:var(--r-pill); background:var(--surface);
           color:var(--ink-2); cursor:pointer; }
    .chart-legend button:hover { border-color:var(--accent); }
    .chart-legend button.solo { border-color:var(--accent); background:var(--accent-soft); }
    .chart-legend button.closed { color:var(--muted); }
    .chart-legend button b { font-weight:600; font-variant-numeric:tabular-nums; }
    .heat { display:grid; grid-template-columns:minmax(130px,210px) repeat(var(--cols),minmax(12px,1fr));
           gap:2px; align-items:center; font-size:12px; }
    .heat .hh { font-size:10.5px; color:var(--muted); }
    .heat .hl { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; color:var(--ink-2); }
    .heat .hl.strong { font-weight:650; color:var(--ink); }
    .heat .hl.link { cursor:pointer; }
    .heat .hl.link:hover { color:var(--accent); }
    .heat .hc { height:20px; border-radius:3px; }
    .heat .hc.none { background:var(--soft); }
    .heat-key { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11.5px; color:var(--muted); }
    .heat-key i { display:inline-block; width:56px; height:8px; border-radius:4px; }
    .heat-key i.neg { background:linear-gradient(90deg, rgba(var(--heat-neg),.95), rgba(var(--heat-neg),.1)); }
    .heat-key i.pos { background:linear-gradient(90deg, rgba(var(--heat-pos),.1), rgba(var(--heat-pos),.95)); }

    /* 效率走勢 */
    .eff-controls { display:grid; gap:10px; }
    .eff-row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; }
    .eff-row > .lbl { flex:none; width:44px; font-size:12px; font-weight:600; color:var(--muted); }
    .seg { display:inline-flex; flex-wrap:wrap; max-width:100%; min-width:0; border:1px solid var(--line-strong); border-radius:var(--r-sm); overflow:hidden; }
    .seg button { font:inherit; font-size:12.5px; line-height:1.2; padding:6px 11px; border:0; border-right:1px solid var(--line);
           background:var(--surface); color:var(--ink-2); cursor:pointer; }
    .seg button:last-child { border-right:0; }
    .seg button:hover:not(:disabled) { background:var(--accent-soft); }
    .seg button.on { background:var(--accent); color:#fff; }
    .seg button:disabled { color:#b3c1c5; cursor:not-allowed; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { font:inherit; font-size:12.5px; line-height:1.2; padding:5px 11px; border-radius:var(--r-pill); cursor:pointer;
           border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2); }
    .chip:hover { border-color:var(--accent); }
    .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
    .chip.part { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
    .chip.ghost { border-style:dashed; color:var(--accent); }
    .chip .n { margin-left:5px; font-size:11px; opacity:.85; font-variant-numeric:tabular-nums; }
    .pick { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:4px 14px; margin-top:4px;
           padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--soft); }
    .pick-item { display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer; }
    .eff-custom { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; }
    .eff-custom input { font:inherit; font-size:12.5px; padding:5px 7px; border:1px solid var(--line-strong);
           border-radius:var(--r-sm); color:var(--ink); background:var(--surface); }
    .eff-views { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-left:auto; }
    .eff-views select { font-size:12.5px; padding:5px 8px; }
    .eff-busy { font-size:12px; color:var(--muted); }
    .card-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 12px; margin:0 0 10px; }
    .card-head h3 { margin:0; }
    .card-head .note { margin:0; }
    .minis { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
    .mini { border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px 4px; }
    .mini h4 { display:flex; justify-content:space-between; gap:8px; margin:0 0 4px; font-size:12.5px; font-weight:650; }
    .mini h4 span:last-child { font-weight:600; font-variant-numeric:tabular-nums; }
    table.plain.eff-rank th:nth-child(2), table.plain.eff-rank td:nth-child(2) { text-align:right; }
    table.plain.eff-rank td:first-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    table.plain.eff-rank th.sortable { cursor:pointer; user-select:none; }
    table.plain.eff-rank th.sortable:hover { color:var(--accent); }
    table.board.has-spark { min-width:1200px; }
    table.board th.c-spark, table.board td.c-spark { padding-left:8px; padding-right:12px; }
    table.board.has-spark col.c-date { width:8.8%; }
    table.board.has-spark col.c-size { width:11.2%; }
    table.board.has-spark col.c-sym  { width:12.3%; }
    table.board.has-spark col.c-mark { width:9.8%; }
    table.board.has-spark col.c-liq  { width:10.5%; }
    table.board.has-spark col.c-dist { width:8.9%; }
    table.board.has-spark col.c-grid { width:10.9%; }
    table.board.has-spark col.c-day  { width:10.6%; }
    table.board.has-spark col.c-pct  { width:9.0%; }
    table.board.has-spark col.c-spark { width:8.0%; }

    @media (max-width:1000px) {
      .stats { grid-template-columns:repeat(6,minmax(0,1fr)); }
      .stat.wide { grid-column:span 6; }
    }
    @media (max-width:760px) {
      main { padding:16px 12px 48px; }
      header { padding:16px 16px 0; }
      .stats { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .stat, .stat.wide { grid-column:span 3; }
      .stat strong { font-size:21px; }
      .cal-cell { min-height:64px; }
      .fund-cal .cal-cell { min-height:64px; }
      .fund-cal .cal-amt.opt { display:none; }
      .fund-cal .cal-amt > span:first-child { display:none; }
      .fund-cal .cal-amt { justify-content:flex-end; }
      .fund-cal .cal-amt b, .fund-cal .cal-amt b.net { font-size:10px; }
      .statlist { grid-template-columns:1fr; gap:2px 0; }
      .statlist dd { margin-bottom:10px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Pionex Grid 倉位</h1>
  <p class="sub">SQLite 本機帳本 · 每日 08:05 擷取並同步 Portfolio · 08:12 Excel 讀同一份帳本</p>
  <nav>
    <button data-page="live" class="active">目前倉位</button>
    <button data-page="records">倉位紀錄</button>
    <button data-page="daily">每日詳情</button>
    <button data-page="calendar">月曆</button>
    <button data-page="efficiency">效率走勢</button>
    <button data-page="funding">資金費（試做）</button>
    <button data-page="levercmp">槓桿對照（試做）</button>
    <button data-page="history">單一網格</button>
    <button data-page="settlements">關倉紀錄</button>
    <button data-page="status">執行狀態</button>
    <a class="btn" href="/api/v1/export.xlsx">匯出 Excel</a>
    <a class="btn" href="/architecture.html">架構說明</a>
  </nav>
</header>
<div id="flash" class="flash-wrap" role="status" aria-live="polite"></div>
<main id="app"><p class="muted">載入中…</p></main>
<script src="/chart.js"></script>
<script>
const app = document.getElementById("app");
let page = "live";
let liveData = null;
let liveBusy = false;
let historyId = new URLSearchParams(location.search).get("grid") || "";
let historyFrom = "";
const PAGES = ["live", "records", "daily", "calendar", "efficiency", "funding", "levercmp", "history", "settlements", "status"];
const PAGE_LABELS = {
  live: "目前倉位",
  records: "倉位紀錄",
  daily: "每日詳情",
  calendar: "月曆",
  efficiency: "效率走勢",
  funding: "資金費",
  levercmp: "槓桿對照",
  settlements: "關倉紀錄",
  status: "執行狀態",
};
let boardData = null;
let dailyData = null;
let boardSort = { key: "", dir: "desc" };
let dailySort = { key: "", dir: "desc" };
let dailyOpen = null;
let calendarData = null;
let calMonth = null;
let calSelected = "";
let calLine = "total";

function fmtTaipei(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) {
    const s = String(iso).replace("T", " ").slice(0, 19);
    return s ? s + " +08:00" : "";
  }
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hourCycle: "h23",
  }).formatToParts(d);
  const g = (t) => (parts.find((p) => p.type === t) || {}).value || "";
  return `${g("year")}-${g("month")}-${g("day")} ${g("hour")}:${g("minute")}:${g("second")} +08:00`;
}
const n = (v, d=2) => v == null || v === "" || Number.isNaN(Number(v)) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits:d, maximumFractionDigits:d });
const usdt = (m) => m && m.usdt != null ? n(m.usdt, 2) : "—";
const twd = (m) => m && m.twd != null ? "約 " + n(m.twd, 0) + " TWD" : "";
const both = (m) => {
  if (!m || m.usdt == null) return "—";
  const extra = twd(m);
  return n(m.usdt, 2) + `<span class="unit">USDT</span>` + (extra ? `<span class="twd">${extra}</span>` : "");
};
const bothSigned = (m) => {
  if (!m || m.usdt == null) return "—";
  const extra = twd(m);
  return signed(m.usdt) + `<span class="unit">USDT</span>` + (extra ? `<span class="twd">${extra}</span>` : "");
};
const cls = (v) => { const x = Number(v); if (!Number.isFinite(x) || x === 0) return ""; return x > 0 ? "up" : "down"; };
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
const tip = (label, text) => `<span class="hint" tabindex="0" data-tip="${esc(text)}">${label}</span>`;
const cell = (main, sub) => `<span class="v">${main}</span><span class="sub">${sub || ""}</span>`;

let tipHost = null;

function hideTip() {
  const pop = document.getElementById("hint-pop");
  if (pop) pop.remove();
  tipHost = null;
}

function showTip(el) {
  const text = el.getAttribute("data-tip") || "";
  if (!text) return;
  hideTip();
  tipHost = el;
  const box = document.createElement("div");
  box.id = "hint-pop";
  box.className = "hint-pop";
  box.textContent = text;
  document.body.appendChild(box);
  const r = el.getBoundingClientRect();
  const left = Math.min(r.left + window.scrollX, window.scrollX + window.innerWidth - 320);
  box.style.left = Math.max(8, left) + "px";
  box.style.top = (r.bottom + window.scrollY + 8) + "px";
}

document.addEventListener("mouseover", (e) => {
  const host = e.target.closest("[data-tip]");
  if (host) { if (host !== tipHost) showTip(host); return; }
  if (tipHost) hideTip();
});
document.addEventListener("focusin", (e) => {
  const host = e.target.closest("[data-tip]");
  if (host) showTip(host);
  else if (tipHost) hideTip();
});
window.addEventListener("scroll", () => { if (tipHost) hideTip(); }, true);

const flashBox = document.getElementById("flash");

function showFlash(text, kind = "info") {
  flashBox.innerHTML = `<div class="notice${kind === "error" ? " is-error" : ""}"><span>${esc(text)}</span>`
    + `<button type="button" aria-label="關閉提示">×</button></div>`;
  flashBox.querySelector("button").onclick = clearFlash;
}

function clearFlash() { flashBox.innerHTML = ""; }

// 頁面放在網址 #hash：重新整理留在原頁，瀏覽器上一頁可回到來源頁。
function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  const [name, ...rest] = raw.split("/");
  return { page: PAGES.includes(name) ? name : "", id: rest.join("/") };
}

function pageHash(name) {
  return name === "history" && historyId ? "#history/" + encodeURIComponent(historyId) : "#" + name;
}

function go(name, opts = {}) {
  const target = pageHash(name);
  if (location.hash === target) { applyRoute(); return; }
  if (opts.replace) location.replace(target);
  else location.hash = target;
}

function applyRoute() {
  const route = parseHash();
  const next = route.page || "live";
  if (next === "history" && route.id) historyId = route.id;
  if (next !== "history") historyFrom = "";
  if (next !== page) clearFlash();
  page = next;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.page === page));
  render();
}

window.addEventListener("hashchange", applyRoute);
document.querySelectorAll("nav button").forEach((btn) => {
  btn.onclick = () => go(btn.dataset.page);
});

async function get(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + " " + res.status);
  return res.json();
}

function signed(v, digits=2) {
  if (v == null || v === "") return "—";
  const x = Number(v);
  if (!Number.isFinite(x)) return "—";
  const t = n(Math.abs(x), digits);
  return (x > 0 ? "+" : x < 0 ? "-" : "") + t;
}

function ageText(iso) {
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return null;
  const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
  const text = mins < 1 ? "剛剛" : mins < 60 ? `${mins} 分鐘前` : mins < 1440 ? `${Math.floor(mins / 60)} 小時 ${mins % 60} 分前` : `${Math.floor(mins / 1440)} 天前`;
  return { text, stale: mins > 35 };
}

function publishText(pub) {
  if (!pub) return "";
  if (pub.ok) return "已同步到 Portfolio。";
  if (pub.skipped) return "未設定 Gist，Portfolio 沒有同步。";
  return "Portfolio 同步失敗（" + (pub.error || "未知錯誤") + "），排程會自動重試，也可在執行狀態頁重新發布。";
}

function moneyNum(m) {
  if (m == null || m.usdt == null || m.usdt === "") return null;
  const x = Number(m.usdt);
  return Number.isFinite(x) ? x : null;
}

function efficiency3x(profit, investment, leverage) {
  const multiple = parseFloat(leverage);
  if (!Number.isFinite(profit) || !Number.isFinite(investment) || investment <= 0
      || !Number.isFinite(multiple) || multiple <= 0) return null;
  return profit / investment * 100 * 3 / multiple;
}

function sortValue(r, key, profitKey) {
  const day = profitKey === "daily" ? r.daily_profit : r.profit_24h;
  const dayV = moneyNum(day);
  const sizeV = moneyNum(r.investment) != null ? moneyNum(r.investment) : moneyNum(r.size);
  const pct = efficiency3x(dayV, sizeV, r.leverage);
  if (key === "opened_at") return r.opened_at || "";
  if (key === "size") return sizeV;
  if (key === "symbol") return (r.symbol || "").toLowerCase();
  if (key === "mark") return Number(r.mark_price);
  if (key === "liq") return Number(r.liq_price);
  if (key === "dist") return Number(r.liq_distance_pct);
  if (key === "grid") return moneyNum(r.grid_profit);
  if (key === "day") return dayV;
  if (key === "pct") return pct;
  return null;
}

function missingSort(v) {
  return v == null || v === "" || (typeof v === "number" && !Number.isFinite(v));
}

function sortedRows(rows, sort, profitKey) {
  if (!sort || !sort.key) return rows.slice();
  const dir = sort.dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const av = sortValue(a, sort.key, profitKey);
    const bv = sortValue(b, sort.key, profitKey);
    if (missingSort(av) && missingSort(bv)) return 0;
    if (missingSort(av)) return 1;
    if (missingSort(bv)) return -1;
    if (typeof av === "string" && typeof bv === "string") return av.localeCompare(bv, "zh-Hant") * dir;
    if (av < bv) return -dir;
    if (av > bv) return dir;
    return 0;
  });
}

function sortClass(key, sort) {
  if (!sort || sort.key !== key) return "sortable";
  return "sortable " + (sort.dir === "asc" ? "sort-asc" : "sort-desc");
}

// 近 14 天每U效率小走勢（每日帳本），目前倉位與倉位紀錄共用，10 分鐘內不重抓。
let sparkData = null;
let sparkAt = 0;
async function ensureSparks() {
  if (sparkData && Date.now() - sparkAt < 10 * 60 * 1000) return;
  try {
    sparkData = await get("/api/v1/efficiency/sparklines?days=14");
    sparkAt = Date.now();
  } catch (_) {
    sparkData = null;
  }
}

function sparkCell(id) {
  const vals = (sparkData && sparkData.rows && sparkData.rows[id]) || [];
  const got = vals.filter((v) => v != null && Number.isFinite(v));
  const avg = got.length ? got.reduce((a, b) => a + b, 0) / got.length : null;
  const note = avg == null ? "近 14 天沒有完整的每日紀錄"
    : `近 ${got.length} 天平均每U效率 ${signed(avg, 3)}%／日（3 倍換算）`;
  return `<td class="n c-spark" data-tip="${esc(note)}">${Charts.spark(vals, { width: 72, height: 20 })}`
    + `<span class="sub">${avg == null ? "" : "均 " + signed(avg, 3) + "%"}</span></td>`;
}

function sizeSub(r) {
  const lev = r.equivalent_leverage != null ? `${n(r.equivalent_leverage, 2)}x` : "";
  if (moneyNum(r.extra_margin)) return `等效 ${n(moneyNum(r.equivalent), 0)} · ${lev}`;
  return lev ? `等效槓桿 ${lev}` : "";
}

function positionTable(rows, profitKey, sort) {
  if (!rows.length) return "<p class='muted'>沒有倉位列</p>";
  const ordered = sortedRows(rows, sort, profitKey);
  const spark = profitKey === "24h" && !!sparkData;
  const dayTip = profitKey === "daily"
    ? "跟上一次記錄比，這筆倉的網格利潤多了或少了多少。第一天是 0。幣本位（ETH）是當天新增的幣×抓取價，不是把畫面 USDT 直接相減。"
    : "派網回傳的過去 24 小時網格利潤，不是日記帳。";
  const h = (key, extra, label, unit, note) =>
    `<th class="${extra} ${sortClass(key, sort)}" data-sort="${key}">`
    + `<span class="hd-top">${note ? tip(label, note) : label}<i class="arrow"></i></span>`
    + `<span class="hd-unit">${unit || ""}</span></th>`;
  return `<table class="board${spark ? " has-spark" : ""}"><colgroup>
    <col class="c-date"><col class="c-size"><col class="c-sym"><col class="c-mark">
    <col class="c-liq"><col class="c-dist"><col class="c-grid"><col class="c-day"><col class="c-pct">${spark ? '<col class="c-spark">' : ""}
  </colgroup><thead><tr>
    ${h("opened_at", "t c-date", "建倉日期", "台北時間")}${h("size", "n c-size", "倉位大小", "等效 · 等效槓桿", "大字是派網顯示的投入（倉位）。小字：等效倉位＝投入＋追加保證金；等效槓桿＝投入 × 派網槓桿 ÷ 等效倉位，也就是把你留在倉裡的保證金算進去後的槓桿。調高槓桿但保證金留在原倉時，這兩個數字都不變。")}${h("symbol", "t c-sym", "標的", "派網槓桿 / 方向")}${h("mark", "n c-mark", "現價", "Mark")}
    ${h("liq", "n c-liq", "強平價", "預估")}${h("dist", "n c-dist", "強平距離", "剩餘 %", "離強平還剩多少％，0 到 100。多數是 U 本位；幣本位會另外換算。")}${h("grid", "n c-grid", "網格利潤", "USDT", "這筆倉目前帳上的累計網格利潤。複投後會從 0 再算。")}${h("day", "n c-day", "單日利潤", "USDT", dayTip)}${h("pct", "n c-pct", "每U效率", "3 倍 · %", "單日利潤 ÷ 倉位大小 × 3 ÷ 原槓桿倍率 × 100%。統一按比例換算為 3 倍槓桿，比較不同倉位的配對收益效率。")}${spark
    ? `<th class="n c-spark"><span class="hd-top">${tip("近 14 天", "每日帳本的每U效率（3 倍換算）走勢，虛線是 0。滑過看平均。")}</span><span class="hd-unit">每U效率</span></th>` : ""}
  </tr></thead><tbody>${ordered.map((r) => {
    const day = profitKey === "daily" ? r.daily_profit : r.profit_24h;
    const dayV = day && day.usdt;
    const size = r.investment && r.investment.usdt != null ? r.investment : r.size;
    const pct = efficiency3x(moneyNum(day), moneyNum(size), r.leverage);
    const opened = String(r.opened_at || "").replace("T", " ");
    const openDate = opened.split(" ")[0] || "";
    const openTime = opened.split(" ")[1] || "";
    const chip = profitKey === "daily" ? eventChip(r.event || r.status) : "";
    return `<tr class="clickable" data-id="${esc(r.bu_order_id || "")}">
      <td class="t c-date">${cell(openDate || "—", openTime)}</td>
      <td class="n c-size">${cell(usdt(size), sizeSub(r))}</td>
      <td class="t c-sym">${cell(esc(r.symbol || "—"), esc(r.leverage || "") + chip)}</td>
      <td class="n c-mark">${cell(n(r.mark_price, 4), "")}</td>
      <td class="n c-liq">${cell(n(r.liq_price, 4), "")}</td>
      <td class="n c-dist ${cls(r.liq_distance_pct)}">${cell(r.liq_distance_pct == null ? "—" : n(r.liq_distance_pct, 2) + "%", "")}</td>
      <td class="n c-grid">${cell(usdt(r.grid_profit), twd(r.grid_profit))}</td>
      <td class="n c-day ${cls(dayV)}">${cell(signed(dayV), twd(day))}</td>

function taipeiToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
}

async function postJson(url, body) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || (url + " " + res.status));
  return data;
}

// The 30-minute task rewrites the server's cached snapshot. Re-read that cache (no Pionex call)
// when the tab comes back into view and every 5 minutes, so an open page never sits on an old capture.
async function pollLive() {
  if (page !== "live" || liveBusy || document.hidden || document.getElementById("commitMask")) return;
  let next;
  try { next = await get("/api/v1/live"); } catch { return; }
  if (page !== "live" || liveBusy || !next || !next.as_of) return;
  if (liveData && liveData.as_of === next.as_of) return;
  liveData = next;
  paintLive();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLive(); });
setInterval(pollLive, 5 * 60 * 1000);

function eventLabel(ev) {
  const map = { baseline:"基準", new:"新增", continue:"續存", closed:"關倉", closed_unresolved:"關倉未對上", reinvest:"複投", add:"加倉", review:"待確認", withdraw:"提取", reduce:"減倉" };
  return String(ev || "").split("+").map((p) => map[p] || esc(p)).filter(Boolean).join("＋") || "—";
}

function eventChip(ev) {
  const key = String(ev || "");
  if (!key || key === "continue" || key === "baseline" || key === "new") return "";
  const kind = key.split("+").includes("review") ? "is-review" : key.split("+").includes("add") ? "is-add" : "";
  return ` <span class="event-tag ${kind}">${eventLabel(key)}</span>`;
}

function eventCell(r, date) {
  const ev = r.event || r.status || "";
  const review = String(ev).split("+").includes("review");
  let html = `<span class="event-tag${review ? " is-review" : String(ev).split("+").includes("add") ? " is-add" : ""}">${eventLabel(ev)}</span>`;

    </div>`;
  }
  return html;
}

  const byDate = {};
  days.forEach((d) => { if (d.capture_date) byDate[d.capture_date] = d; });

  if (!calMonth) calMonth = { y: parts[0], m: parts[1] };

  const first = new Date(y, m - 1, 1);
  const startPad = first.getDay();
  const dim = new Date(y, m, 0).getDate();
  const dows = ["日","一","二","三","四","五","六"];

    const v = moneyNum(d.daily_profit);
    if (v != null) heatMax = Math.max(heatMax, Math.abs(v));
  });
  const cellHeat = (rec) => {
    const v = moneyNum(rec.daily_profit);
    if (!heatMax || v == null || v === 0 || Number(rec.unresolved_count) > 0) return "";
    const a = (0.05 + 0.3 * Math.min(1, Math.abs(v) / heatMax)).toFixed(3);

      <tbody>${rowHtml}</tbody></table>

  document.getElementById("calPrev").onclick = () => {
    calMonth.m -= 1;
    if (calMonth.m < 1) { calMonth.m = 12; calMonth.y -= 1; }
    paintCalendar();
  };
  document.getElementById("calNext").onclick = () => {
    calMonth.m += 1;
    if (calMonth.m > 12) { calMonth.m = 1; calMonth.y += 1; }
    paintCalendar();
  };
  app.querySelectorAll("button.cal-cell[data-date]").forEach((btn) => {
    btn.onclick = () => { calSelected = btn.dataset.date; paintCalendar(); };
  });
  app.querySelectorAll("button[data-calline]").forEach((btn) => {
    btn.onclick = () => { calLine = btn.dataset.calline; paintCalendar(); };
  });
  drawCalendarBars(byDate, y, m, dim);
  bindEventDecisions();
  bindHistoryClicks();
}

function drawCalendarBars(byDate, y, m, dim) {
  const el = document.getElementById("calBars");
  if (!el) return;
  const dates = Array.from({ length: dim }, (_, i) => `${y}-${String(m).padStart(2, "0")}-${String(i + 1).padStart(2, "0")}`);
  const recs = dates.map((d) => byDate[d]);
  const daily = recs.map((r) => (r ? moneyNum(r.daily_profit) : null));
  const total = recs.map((r) => (r ? moneyNum(r.true_profit) : null));
  const running = recs.map((r) => (r ? moneyNum(r.cumulative) : null));
  const line = calLine === "running" ? running : total;
  const accent = Charts.token("--accent", "#2e6970");
  const sel = dates.indexOf(calSelected);
  Charts.plot(el, {
    n: dim, labels: dates.map((_, i) => String(i + 1)), height: 170, label: "當月每日利潤",
    stacks: [
      { id: "up", color: accent, values: daily.map((v) => (v != null && v > 0 ? v : null)) },
      { id: "down", color: Charts.token("--down", "#b42318"), values: daily.map((v) => (v != null && v < 0 ? v : null)) },
    ],
    barFlags: recs.map((r) => (r && Number(r.unresolved_count) > 0 ? 2 : 0)),
    overlay: { values: line, color: Charts.token("--ink-2", "#3d4d54"), format: (v) => String(Math.round(v)) },
    yFormat: (v) => String(+v.toFixed(2)),
    selected: sel >= 0 ? sel : null,
    tooltip: (i) => {
      const r = recs[i];
      if (!r) return "";
      return Charts.tipRows(`${dates[i]}${Number(r.unresolved_count) > 0 ? "（待補）" : ""}`, [
        { color: accent, label: "單日利潤", value: signed(daily[i]) + " U", cls: cls(daily[i]) },
        { color: calLine === "total" ? Charts.token("--ink-2", "#3d4d54") : null, label: "歷史累計（含已關倉）", value: total[i] == null ? "—" : n(total[i], 2) + " U" },
        { color: calLine === "running" ? Charts.token("--ink-2", "#3d4d54") : null, label: "運行中配對", value: running[i] == null ? "—" : n(running[i], 2) + " U" },
        { label: "倉位數", value: String(r.active_count ?? "—") },
      ], "點長條切換到那一天");
    },
    onClick: (i) => { if (recs[i]) { calSelected = dates[i]; paintCalendar(); } },
  });
}

function fmt(value) {
  if (value === null || value === undefined || value === "") return "—";
  if (typeof value === "object") {
    if (value.usdt != null) return usdt(value);
    try { return JSON.stringify(value); } catch { return String(value); }
  }
  return String(value);
}

function kvTable(rows) {
  if (!rows || !rows.length) return "<p class='muted'>無</p>";
  return `<table class="kv">${rows.map((r) => `<tr><th>${esc(r.key)}</th><td>${esc(fmt(r.value))}</td></tr>`).join("")}</table>`;
}

let gridIntra = { range: "7d", g: "1h", metric: "usdt" };
let gridIntraSeq = 0;

async function drawGridIntraday(id) {
  const el = document.getElementById("gridIntra");
  const ctl = document.getElementById("gridIntraCtl");
  if (!el || !ctl) return;
  const seq = ++gridIntraSeq;
  const st = gridIntra;
  ctl.innerHTML = effSeg("gi-range", [["24h", "24 小時"], ["7d", "7 天"], ["30d", "30 天"]], st.range) + " "
    + effSeg("gi-grain", [["1h", "1 小時"], ["1d", "1 天"]], st.g) + " "
    + effSeg("gi-metric", [["usdt", "USDT"], ["eff", "日化 %"]], st.metric);
  ctl.querySelectorAll("button").forEach((btn) => {
    btn.onclick = () => {
      if (btn.dataset.giRange) st.range = btn.dataset.giRange;
      if (btn.dataset.giGrain) st.g = btn.dataset.giGrain;
      if (btn.dataset.giMetric) st.metric = btn.dataset.giMetric;
      drawGridIntraday(id);
    };
  });
  const now = Date.now();
  const days = { "24h": 1, "7d": 7, "30d": 30 }[st.range];
  const qs = new URLSearchParams({ from: isoTaipei(now - days * 24 * HOUR_MS), to: isoTaipei(now), g: st.g, ids: id, extras: "0" });
  let d;
  try {
    d = await get("/api/v1/efficiency?" + qs.toString());
  } catch (err) {
    if (seq === gridIntraSeq) el.innerHTML = `<p class="warn">${esc(err.message)}</p>`;
    return;
  }
  if (seq !== gridIntraSeq || !document.body.contains(el)) return;
  const s = d.series[id];
  const metric = st.metric;
  const values = s ? d.buckets.map((_, k) => (metric === "usdt" ? s.profit[k] : s.eff[k])) : [];
  const accent = Charts.token("--accent", "#2e6970");
  const label = metric === "usdt" ? "時段利潤" : "日化每U效率";
  const common = {
    n: d.buckets.length, times: d.buckets, g: d.granularity, height: 200, label,
    empty: st.g === "1h" ? "這段期間還沒有每 30 分鐘的資料（從每小時記錄上線後開始累積）" : "這段期間沒有資料",
    yFormat: effAxis(metric),
    markers: (d.events || []).filter((e) => e.id === id).map((e) => {
      let k = -1;
      d.buckets.forEach((t, i) => { if (t <= e.t) k = i; });
      return { i: k, tip: `${eventLabel(e.event)}（${Charts.fmtTime(e.t, "1h")}）` };
    }).filter((m) => m.i >= 0),
    tooltip: (k) => values[k] == null ? "" : Charts.tipRows(Charts.fmtRange(d.buckets[k], d.bucket_hours[k], d.granularity),
      [{ color: accent, label, value: effFmt(values[k], metric) + effFlagText(s.flag[k]), cls: cls(values[k]) }]),
  };
  if (!s) { Charts.plot(el, { ...common, n: 0 }); return; }
  if (metric === "usdt") {
    Charts.plot(el, { ...common, barFlags: s.flag, stacks: [
      { id: "up", color: accent, values: values.map((v) => (v != null && v > 0 ? v : null)) },
      { id: "down", color: Charts.token("--down", "#b42318"), values: values.map((v) => (v != null && v < 0 ? v : null)) },
    ] });
  } else {
    Charts.plot(el, { ...common, lines: [{ id, color: accent, values, flags: s.flag, strong: true }] });
  }
}

let settlementData = null;
let settlementEditId = "";
const CLOSE_REASON = { profit_stop: "止盈", loss_stop: "止損", user_cancel: "手動關倉", liquidation: "強平", liquidate: "強平", expired: "到期" };
const AUDIT_LABELS = { closed_at: "關倉時間", grid_profit: "最終配對", lifetime_grid_profit: "完整配對", net_profit: "淨損益",
  own_cash_in: "自己投入", funding_fee: "資金費", fee: "手續費", settlement_usdt_rate: "換算價", note: "備註" };
const reasonLabel = (r) => r ? (CLOSE_REASON[r] || r) : "—";
const curDigits = (cur) => (cur || "USDT") === "USDT" ? 2 : 6;
const amtS = (v, cur) => v == null || v === "" ? "—" : signed(v, curDigits(cur));
const amtP = (v, cur) => v == null || v === "" ? "—" : n(v, curDigits(cur));

function toUsdt(v, r) {
  if (v == null || v === "") return null;
  if ((r.currency || "USDT") === "USDT") return Number(v);
  return r.settlement_usdt_rate ? Number(v) * Number(r.settlement_usdt_rate) : null;
}

function settlementState(r) {
  if (r.status !== "settled") return `<span class="badge warn">淨損益待確認</span>`;
  if (r.net_method === "manual") return `<span class="badge">人工補登</span>`;
  if (r.needs_review) return `<span class="badge warn">需核對 · 兩法差 ${amtP(Math.abs(Number(r.net_check_diff)), r.currency)}</span>`;
  if (r.own_cash_in_source === "manual") return `<span class="badge ok">投入已人工確認</span>`;
  if (r.net_check_ok) return `<span class="badge ok">自動確認 · 兩法一致</span>`;
  return `<span class="badge ok">自動確認</span>`;
}

function closureCard(r) {
  const cur = r.currency || "USDT";
  return `<div class="card"><h3>關倉結算　${settlementState(r)}</h3>
    <div class="stats">
      <div class="stat"><span class="label">最終淨損益</span><strong class="${cls(r.net_profit)}">${amtS(r.net_profit, cur)}<span class="unit">${esc(cur)}</span>${r.roi_pct != null ? `<span class="pct ${cls(r.roi_pct)}">${signed(r.roi_pct)}%</span>` : ""}</strong></div>
      <div class="stat"><span class="label">自己投入</span><strong>${amtP(r.own_cash_in, cur)}<span class="unit">${esc(cur)}</span></strong></div>
      <div class="stat"><span class="label">實際拿回</span><strong>${amtP(r.received, cur)}<span class="unit">${esc(cur)}</span></strong></div>
      <div class="stat meta"><span class="label">關倉原因／持有</span><strong>${esc(reasonLabel(r.close_reason))} · ${r.hold_days ?? "—"} 天</strong></div>
    </div>
    <p class="muted"><a href="#settlements">到關倉紀錄查看計算明細或修正</a></p>
  </div>`;
}

function settlementTotals(rows) {
  const t = { net: 0, grid: 0, nonGrid: 0, win: 0, loss: 0, settled: 0, coins: {} };
  rows.forEach((r) => {
    const cur = r.currency || "USDT";
    if (r.status === "settled" && r.net_profit != null) {
      const v = Number(r.net_profit);
      t.settled += 1;
      if (v > 0) t.win += 1; else if (v < 0) t.loss += 1;
      const u = toUsdt(r.net_profit, r);
      if (u != null) t.net += u;
      if (cur !== "USDT") t.coins[cur] = (t.coins[cur] || 0) + v;
    }
    const g = toUsdt(r.lifetime_grid_profit, r);
    if (g != null) t.grid += g;
    const ng = toUsdt(r.non_grid_profit, r);
    if (ng != null) t.nonGrid += ng;
  });
  return t;
}

function drawSettlementBars(rows) {
  const el = document.getElementById("settleBars");
  if (!el) return;
  const accent = Charts.token("--accent", "#2e6970");
  const up = Charts.token("--up", "#1f7a4d"), down = Charts.token("--down", "#b42318");
  const fmtU = (v) => (v == null || !Number.isFinite(v) ? "—" : signed(v) + " U");
  Charts.hbars(el, {
    label: "每筆關倉損益", format: (v) => String(Math.round(v)),
    rows: rows.map((r) => {
      const grid = toUsdt(r.lifetime_grid_profit, r);
      const other = toUsdt(r.non_grid_profit, r);
      const net = r.status === "settled" ? toUsdt(r.net_profit, r) : null;
      const when = r.closed_at ? fmtTaipei(r.closed_at).slice(0, 10) : "關倉時間待補";

        sub: `${when} · ${reasonLabel(r.close_reason)}`,
        parts: [{ value: grid, color: accent }, { value: other, color: other != null && other < 0 ? down : up }],
        marker: net,
        tip: `${r.symbol || "—"}（${when}）配對 ${fmtU(grid)}、非配對 ${fmtU(other)}、淨損益 ${r.status === "settled" ? fmtU(net) : "待確認"}`,

  });
}

// 共用確認／輸入視窗：回傳 null（取消）、true，或 { value, check }。
function askDialog({ title, body = "", input = null, okText = "確定", danger = false }) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.className = "mask";
    mask.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${body ? `<p>${body}</p>` : ""}
      ${input ? `<label class="field">${esc(input.label)}<input id="askInput" maxlength="${input.max || 40}" value="${esc(input.value || "")}"></label>
        ${input.check ? `<label class="eff-custom"><input type="checkbox" id="askCheck" ${input.check.value ? "checked" : ""}> ${esc(input.check.label)}</label>` : ""}` : ""}
      <div class="actions"><button class="btn ghost" type="button" data-act="no">取消</button>
        <button class="btn${danger ? " danger" : ""}" type="button" data-act="ok">${esc(okText)}</button></div></div>`;
    document.body.appendChild(mask);
    const field = mask.querySelector("#askInput");
    const done = (ok) => {
      const check = mask.querySelector("#askCheck");
      const out = !ok ? null : input ? { value: field.value.trim(), check: !!(check && check.checked) } : true;
      mask.remove();
      resolve(out);
    };
    mask.querySelector('[data-act="no"]').onclick = () => done(false);
    mask.querySelector('[data-act="ok"]').onclick = () => done(true);
    mask.addEventListener("keydown", (e) => {
      if (e.key === "Escape") done(false);
      else if (e.key === "Enter" && field) done(true);
    });
    (field || mask.querySelector('[data-act="ok"]')).focus();
  });
}

// ---------------------------------------------------------------- 效率走勢
const HOUR_MS = 3600 * 1000;
const EFF_DEFAULT = { positions: "all", range: "7d", from: "", to: "", granularity: "1h", metric: "usdt", chart: "line", shared_y: true };
const EFF_RANGES = [["today", "今天"], ["24h", "24 小時"], ["7d", "7 天"], ["30d", "30 天"], ["90d", "90 天"], ["all", "全部"], ["custom", "自訂"]];
const EFF_GRAINS = [["30m", "30 分", 0.5], ["1h", "1 小時", 1], ["4h", "4 小時", 4], ["1d", "1 天", 24], ["1w", "週", 168], ["1M", "月", 744]];
const EFF_METRICS = [["usdt", "區間利潤 USDT"], ["eff", "日化每U效率 %"], ["apr", "年化 %"]];
const EFF_CHARTS = [["line", "折線"], ["stack", "堆疊長條"], ["split", "分圖"]];
const EFF_FINE = new Set(["30m", "1h", "4h"]);
const EFF_FLAG = { 1: "未滿", 2: "估", 3: "日帳" };
let effMeta = null;
let effState = null;
let effData = null;
let effError = "";
let effNote = "";
let effBusy = false;
let effSeq = 0;
let effFocus = "";
let effSolo = "";
let effPickOpen = false;
let effView = "";
let effZoomBack = null;
let effRankSort = { key: "eff", dir: "desc" };

const pad2 = (v) => String(v).padStart(2, "0");
function isoTaipei(ms) {
  const d = new Date(ms + 8 * HOUR_MS);
  return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}:${pad2(d.getUTCSeconds())}+08:00`;
}
const inputTaipei = (ms) => isoTaipei(ms).slice(0, 16);
const parseTaipeiInput = (v) => (v ? Date.parse(v + ":00+08:00") : NaN);
function taipeiMidnight(ms) {
  const p = Charts.parts(ms);
  return Date.UTC(p.y, p.mo - 1, p.d) - 8 * HOUR_MS;
}

const effGrainLabel = (g) => (EFF_GRAINS.find((x) => x[0] === g) || [g, g])[1];
function effPos(id) {
  return (effMeta && effMeta.byId && effMeta.byId[id]) || { id, label: String(id).slice(0, 8), color: 0, lifecycle: "active" };
}
const effColor = (id) => Charts.color(effPos(id).color);
const effSymbol = (p) => String(p.symbol || "?").replace("/USDT", "") + (p.product === "coin_margined_contract_grid" ? " 幣本位" : "");

function effSince() {
  const m = effMeta || {};
  const c = [m.ledger_since, m.intraday_since].map((v) => Date.parse(v || "")).filter(Number.isFinite);
  return c.length ? Math.min(...c) : Date.now() - 7 * 24 * HOUR_MS;
}

function effSpan(st = effState) {
  const now = Date.now();
  if (st.range === "custom") {
    const a = parseTaipeiInput(st.from), b = parseTaipeiInput(st.to);
    if (Number.isFinite(a) && Number.isFinite(b) && b > a) return [a, b];
    return [now - 7 * 24 * HOUR_MS, now];
  }
  if (st.range === "today") return [taipeiMidnight(now), now];
  if (st.range === "24h") return [now - 24 * HOUR_MS, now];
  if (st.range === "all") return [effSince(), now];
  const days = { "30d": 30, "90d": 90 }[st.range] || 7;
  return [now - days * 24 * HOUR_MS, now];
}

function effCount(span, g) {
  const hours = (EFF_GRAINS.find((x) => x[0] === g) || EFF_GRAINS[1])[2];
  return Math.ceil((span[1] - span[0]) / (hours * HOUR_MS)) + 1;
}
const effAllowed = (span, g) => effCount(span, g) <= ((effMeta && effMeta.max_buckets) || 2000);

// 顆粒度超過上限時自動調粗，回傳說明文字。
function effFit() {
  const span = effSpan();
  if (effAllowed(span, effState.granularity)) return "";
  const order = EFF_GRAINS.map((x) => x[0]);
  const old = effState.granularity;
  for (let i = order.indexOf(old) + 1; i < order.length; i++) {
    if (effAllowed(span, order[i])) {
      effState.granularity = order[i];
      return `區間太長，顆粒度已從 ${effGrainLabel(old)} 改成 ${effGrainLabel(order[i])}。`;
    }
  }
  return "";
}

function effAlive(p, span) {
  const start = Date.parse(p.ledger_since || p.intraday_since || "");
  if (!Number.isFinite(start)) return false;
  const last = Math.max(...[p.last_seen, p.ledger_until].map((v) => Date.parse(v || "")).filter(Number.isFinite), -Infinity);
  const end = p.lifecycle === "active" || !Number.isFinite(last) ? Date.now() : last;
  return start <= span[1] && end >= span[0] - 36 * HOUR_MS;
}

const effSelected = () => (effState.positions === "all" ? null : new Set(effState.positions));

function effNorm(s) {
  const out = {};
  Object.keys(EFF_DEFAULT).forEach((k) => { out[k] = s[k] === undefined ? EFF_DEFAULT[k] : s[k]; });
  if (Array.isArray(out.positions)) out.positions = out.positions.slice().sort();
  if (out.range !== "custom") { out.from = ""; out.to = ""; }
  return out;
}
const effSettings = () => effNorm(effState);
function effSavedViews() { return (effMeta && effMeta.views) || { views: [], default: null }; }
function effDirty() {
  const v = effSavedViews().views.find((x) => x.name === effView);
  return JSON.stringify(effSettings()) !== JSON.stringify(effNorm(v ? v.settings : {}));
}

function effApplyView(v, load = true) {
  const s = { ...EFF_DEFAULT, ...(v ? v.settings : {}) };
  if (Array.isArray(s.positions)) s.positions = s.positions.filter((id) => effMeta.byId[id]);
  else s.positions = "all";
  if (!EFF_GRAINS.some((x) => x[0] === s.granularity)) s.granularity = EFF_DEFAULT.granularity;
  if (!EFF_RANGES.some((x) => x[0] === s.range)) s.range = EFF_DEFAULT.range;
  if (!EFF_METRICS.some((x) => x[0] === s.metric)) s.metric = EFF_DEFAULT.metric;
  if (!EFF_CHARTS.some((x) => x[0] === s.chart) || (s.chart === "stack" && s.metric !== "usdt")) s.chart = "line";
  effState = s;
  effView = v ? v.name : "";
  effZoomBack = null;
  effSolo = "";
  effFocus = "";
  effNote = "";
  if (load) loadEfficiency();
}

function effVal(s, k) {
  if (!s) return null;
  if (effState.metric === "usdt") return s.profit[k];
  const e = s.eff[k];
  return e == null ? null : effState.metric === "apr" ? e * 365 : e;
}
function effTotalVal(k) {
  const t = effData.total;
  if (effState.metric === "usdt") return t.profit[k];
  const e = t.eff[k];
  return e == null ? null : effState.metric === "apr" ? e * 365 : e;
}
function effRankVal(r) {
  if (!r) return null;
  if (effState.metric === "usdt") return r.profit;
  return r.eff == null ? null : effState.metric === "apr" ? r.eff * 365 : r.eff;
}
function effFmt(v, metric = effState.metric) {
  if (v == null || !Number.isFinite(v)) return "—";
  if (metric === "usdt") { const a = Math.abs(v); return signed(v, a >= 100 ? 1 : a >= 1 ? 2 : 3); }
  return signed(v, metric === "apr" ? 1 : 3) + "%";
}
function effAxis(metric = effState.metric) {
  return (v) => String(+v.toFixed(4)) + (metric === "usdt" ? "" : "%");
}
const effFlagText = (f) => (EFF_FLAG[f] ? `（${EFF_FLAG[f]}）` : "");

function effIds() {
  return Object.keys((effData && effData.series) || {}).sort((a, b) => effPos(a).color - effPos(b).color);
}

function effBucketIndex(t) {
  const b = effData.buckets;
  let lo = 0, hi = b.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (b[mid] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function effMarkers(ids) {
  const want = new Set(ids);
  const out = [];
  (effData.events || []).forEach((e) => {
    if (!want.has(e.id)) return;
    const k = effBucketIndex(e.t);
    if (k < 0) return;
    out.push({ i: k, color: effColor(e.id),
      tip: `${effPos(e.id).label}：${eventLabel(e.event)}（${Charts.fmtTime(e.t, "1h")}${e.source === "ledger" ? "，每日帳本" : ""}）` });
  });
  return out;
}

function effTip(k, lines, withTotal) {
  const d = effData;
  const rows = lines.filter((l) => l.values[k] != null).map((l) => ({
    color: l.color, label: effPos(l.id).label, v: l.values[k], cls: cls(l.values[k]),
    value: effFmt(l.values[k]) + effFlagText(l.flags && l.flags[k]),
  })).sort((a, b) => b.v - a.v);
  if (withTotal) {
    const tv = effTotalVal(k);
    if (tv != null) rows.unshift({ color: Charts.token("--accent", "#2e6970"), label: "合計（已選）", value: effFmt(tv) + effFlagText(d.total.flag[k]), cls: cls(tv) });
  }
  if (!rows.length) return "";
  return Charts.tipRows(Charts.fmtRange(d.buckets[k], d.bucket_hours[k], d.granularity), rows, "", 24);
}

function effZoom(i0, i1) {
  const d = effData;
  const from = d.buckets[i0];
  const to = d.buckets[i1] + d.bucket_hours[i1] * HOUR_MS;
  if (!effZoomBack) effZoomBack = { range: effState.range, from: effState.from, to: effState.to, granularity: effState.granularity };
  effState.range = "custom";
  effState.from = inputTaipei(from);
  effState.to = inputTaipei(to);
  // 放大後時段太少時改用較細的顆粒度；細顆粒度只在有每小時資料的區段才有意義。
  const order = EFF_GRAINS.map((x) => x[0]);
  const since = Date.parse((effMeta && effMeta.intraday_since) || "");
  let k = order.indexOf(effState.granularity);
  while (k > 0 && effCount([from, to], order[k]) < 10) {
    const finer = order[k - 1];
    if (EFF_FINE.has(finer) && !(Number.isFinite(since) && to > since)) break;
    k -= 1;
  }
  effState.granularity = order[k];
  effNote = "";
  loadEfficiency();
}

async function loadEfficiency() {
  const seq = ++effSeq;
  const fitted = effFit();
  if (fitted) effNote = fitted;
  const sel = effSelected();
  if (sel && !sel.size) {
    effData = null;
    effError = "";
    effBusy = false;
    if (page === "efficiency") paintEfficiency();
    return;
  }
  const [a, b] = effSpan();
  const qs = new URLSearchParams({ from: isoTaipei(a), to: isoTaipei(b), g: effState.granularity });
  if (sel) qs.set("ids", [...sel].join(","));
  effBusy = true;
  const busy = document.getElementById("effBusy");
  if (busy) busy.textContent = "載入中…";
  else if (page === "efficiency") paintEfficiency();
  try {
    const res = await fetch("/api/v1/efficiency?" + qs.toString());
    const data = await res.json().catch(() => ({}));
    if (seq !== effSeq) return;
    if (!res.ok) {
      if (data.suggest && data.suggest !== effState.granularity) {
        effNote = `區間太長，顆粒度已改成 ${effGrainLabel(data.suggest)}。`;
        effState.granularity = data.suggest;
        return loadEfficiency();
      }
      throw new Error(data.error || "HTTP " + res.status);
    }
    effData = data;
    effError = "";
  } catch (err) {
    if (seq !== effSeq) return;
    effError = err.message;
  }
  effBusy = false;
  if (page === "efficiency") paintEfficiency();
}

async function renderEfficiency() {
  const meta = await get("/api/v1/efficiency/meta");
  meta.byId = Object.fromEntries((meta.positions || []).map((p) => [p.id, p]));
  effMeta = meta;
  if (!effState) {
    const saved = effSavedViews();
    effApplyView(saved.views.find((v) => v.name === saved.default), false);
  }
  paintEfficiency();
  await loadEfficiency();
}

function effStatsHtml() {
